# Sinkronisasi otomatis upstream -> fork.
#
# Upstream (repo kanonik) : https://github.com/rvansss/esniffer-udang-web
# Fork     (repo kerja)    : https://github.com/dikialiftaufik/esniffer-udang-web
#
# Mekanisme: branch `main` di fork di-rebase di atas `upstream/main`, lalu
# dipush dengan --force-with-lease. Commit milik fork (termasuk file workflow
# ini) tidak hilang, hanya ditulis ulang di atas upstream. Kalau rebase
# konflik, job gagal sebelum push sehingga fork tidak pernah rusak.
#
# Tidak memakai PAT: push memakai GITHUB_TOKEN bawaan repo, yang otomatis
# terbatas pada repo ini dan tidak punya masa kedaluwarsa.

name: Sync Upstream to Fork

on:
  workflow_dispatch:
    inputs:
      sync_branches:
        description: "Sinkronkan juga seluruh branch upstream ke fork"
        type: boolean
        default: false
  schedule:
    # Tiap 6 jam pada menit 23 (menit acak agar tidak menumpuk dengan workflow lain)
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sinkronkan main dan (opsional) branch lain
    runs-on: ubuntu-latest
    env:
      UPSTREAM_URL: https://github.com/rvansss/esniffer-udang-web.git
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch remote (upstream + seluruh branch fork)
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch --all --prune

      - name: Rebase main fork di atas upstream/main
        run: |
          git checkout main
          git rebase upstream/main

      - name: Push main ke fork
        run: |
          git push --force-with-lease origin main

      - name: Sinkronkan branch lain (opsional)
        if: ${{ inputs.sync_branches }}
        continue-on-error: true
        run: |
          # Daftar branch diambil dari ls-remote (hanya branch head asli, tanpa
          # ref simbolik seperti refs/remotes/upstream/HEAD).
          git ls-remote --heads upstream | while read -r sha ref; do
            branch="${ref#refs/heads/}"
            current="$(git rev-parse --verify --quiet "refs/remotes/origin/$branch" || true)"

            if [ -z "$current" ]; then
              echo "::group::$branch (branch baru)"
              git push origin "$sha:refs/heads/$branch"
              echo "::endgroup::"
              continue
            fi

            if [ "$current" = "$sha" ]; then
              echo "$branch sudah selaras"
              continue
            fi

            # Commit di fork yang belum ada di upstream -> jangan ditimpa.
            ahead="$(git rev-list --count "$sha..$current" 2>/dev/null || echo 0)"
            if [ "$ahead" != "0" ]; then
              echo "::warning::$branch dilewati: fork punya $ahead commit sendiri yang belum ada di upstream"
              continue
            fi

            echo "::group::$branch"
            git push --force-with-lease="refs/heads/$branch:$current" origin "$sha:refs/heads/$branch"
            echo "::endgroup::"
          done
